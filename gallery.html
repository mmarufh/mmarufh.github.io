<script>
/* ---------- Gallery ----------
   Write your caption between the quotes after  caption:  for each photo.
   A photo with an empty caption shows no caption.
   To add a photo: upload it next to this file (e.g. gallery-15.jpg), then copy one line below,
   change the file name and write its caption. To remove a photo, delete its line. */
const GALLERY = [
  { file: "gallery-01.jpg", caption: "" },  // group selfie on a rooftop next to cooling towers
  { file: "gallery-02.jpg", caption: "" },  // standing in front of a campus building, sunglasses
  { file: "gallery-03.jpg", caption: "" },  // cricket stadium at night
  { file: "gallery-04.jpg", caption: "" },  // on a suspension bridge, arms crossed
  { file: "gallery-05.jpg", caption: "" },  // at a waterfall with a bamboo stick
  { file: "gallery-06.jpg", caption: "" },  // group selfie at an evening event, purple lights
  { file: "gallery-07.jpg", caption: "" },  // arms open facing a green hill
  { file: "gallery-08.jpg", caption: "" },  // big group in a classroom, hands up
  { file: "gallery-09.jpg", caption: "" },  // large group photo in a hall
  { file: "gallery-10.jpg", caption: "" },  // group selfie by a green brick wall
  { file: "gallery-11.jpg", caption: "" },  // sitting on the beach facing the sea
  { file: "gallery-12.jpg", caption: "" },  // hilltop viewpoint over the valley
  { file: "gallery-13.jpg", caption: "" },  // selfie on a hill trail
  { file: "gallery-14.jpg", caption: "" },  // selfie walking through a narrow stream gorge
];

(() => {
  const list = document.getElementById("gallery-list");
  const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  GALLERY.forEach((g, i) => {
    const fig = document.createElement("figure");
    fig.innerHTML = `<button type="button" data-i="${i}" aria-label="Open photo ${i + 1}">
        <img src="${g.file}" alt="${esc(g.caption || "Photo " + (i + 1))}" loading="lazy">
      </button>` + (g.caption ? `<figcaption>${esc(g.caption)}</figcaption>` : "");
    list.appendChild(fig);
  });

  const lb = document.getElementById("lightbox"), img = document.getElementById("lb-img"), cap = document.getElementById("lb-cap");
  let cur = 0;
  const show = i => {
    cur = (i + GALLERY.length) % GALLERY.length;
    img.src = GALLERY[cur].file; img.alt = GALLERY[cur].caption || "Photo " + (cur + 1);
    cap.textContent = GALLERY[cur].caption; lb.hidden = false;
  };
  const close = () => { lb.hidden = true; };
  list.addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) show(+b.dataset.i); });
  lb.querySelector(".lb-close").onclick = close;
  lb.querySelector(".lb-prev").onclick = () => show(cur - 1);
  lb.querySelector(".lb-next").onclick = () => show(cur + 1);
  lb.addEventListener("click", e => { if (e.target === lb) close(); });
  document.addEventListener("keydown", e => {
    if (lb.hidden) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") show(cur - 1);
    if (e.key === "ArrowRight") show(cur + 1);
  });
})();
</script>
